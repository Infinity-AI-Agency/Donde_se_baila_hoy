<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Dónde se baila hoy? — En Vallarta</title>

<!-- Vista previa al compartir (WhatsApp, Facebook, iMessage, etc.) -->
<meta property="og:title" content="¿Dónde se baila hoy? — En Vallarta">
<meta property="og:description" content="Eventos, DJs y bandas en vivo en Puerto Vallarta. Entérate dónde bailar hoy.">
<meta property="og:image" content="https://REEMPLAZA-CON-TU-DOMINIO/og-image.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://REEMPLAZA-CON-TU-DOMINIO/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="¿Dónde se baila hoy? — En Vallarta">
<meta name="twitter:description" content="Eventos, DJs y bandas en vivo en Puerto Vallarta.">
<meta name="twitter:image" content="https://REEMPLAZA-CON-TU-DOMINIO/og-image.png">
<style>
  :root{
    --noche: #12151c;
    --noche-2: #1b202b;
    --oro: #e0a940;
    --coral: #ff5f5f;
    --texto: #f3ede3;
    --texto-suave: #b9b3a8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--noche);
    color: var(--texto);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    padding: 32px 10px 60px;
  }
  header{
    text-align:center;
    margin-bottom: 40px;
  }
  header h1{
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--texto);
  }
  header h1 span{
    color: var(--oro);
  }
  header p{
    margin-top: 8px;
    font-family: 'Trebuchet MS', sans-serif;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 16px;
    color: var(--coral);
  }
  .linea{
    width: 60px;
    height: 2px;
    background: var(--oro);
    margin: 18px auto 0;
  }
  main{
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .evento-item{
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .evento-info{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
    font-family: 'Trebuchet MS', sans-serif;
  }
  .evento-nombre{
    font-size: 14px;
    color: var(--texto);
    font-weight: bold;
  }
  .evento-estrellas{
    font-size: 13px;
    color: var(--oro);
    letter-spacing: 1px;
  }
  .banner-slot{
    width: 100%;
    height: 115px;
    margin: 0 auto;
    background: var(--noche-2);
    border: 1px dashed rgba(224,169,64,0.4);
    border-radius: 4px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    padding: 0 0px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .banner-slot:hover, .banner-slot:focus-visible{
    transform: scale(1.01);
    border-color: rgba(224,169,64,0.8);
    outline: none;
  }
  .banner-slot img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 4px;
  }
  .banner-slot .num{
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--oro);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .banner-slot .medida{
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 10px;
    color: var(--texto-suave);
    white-space: nowrap;
  }
  footer{
    text-align:center;
    margin-top: 48px;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 12px;
    color: var(--texto-suave);
    letter-spacing: 1px;
  }

  /* ===== Ficha de información (modal) ===== */
  .overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.activo{
    display: flex;
  }
  .ficha{
    background: var(--noche-2);
    border: 1px solid rgba(224,169,64,0.4);
    border-radius: 10px;
    max-width: 360px;
    width: 100%;
    padding: 28px 24px 24px;
    position: relative;
    text-align: center;
    animation: aparecer 0.18s ease;
  }
  @keyframes aparecer{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .ficha-cerrar{
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    color: var(--texto-suave);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
  }
  .ficha-cerrar:hover{
    color: var(--oro);
  }
  .ficha-logo{
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--noche);
    border: 2px solid var(--oro);
    margin: 0 auto 14px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ficha-logo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .ficha-logo span{
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 9px;
    color: var(--texto-suave);
    letter-spacing: 1px;
  }
  .ficha-nombre{
    font-size: 20px;
    font-weight: 700;
    color: var(--texto);
    margin-bottom: 2px;
  }
  .ficha-tipo{
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--coral);
    margin-bottom: 16px;
  }
  .ficha-datos{
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
    font-family: 'Trebuchet MS', sans-serif;
  }
  .ficha-fila{
    display: flex;
    gap: 10px;
    align-items: baseline;
  }
  .ficha-fila .etiqueta{
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--oro);
    min-width: 60px;
  }
  .ficha-fila .valor{
    font-size: 14px;
    color: var(--texto);
  }

  /* ===== Sección Músicos / DJs disponibles ===== */
  .musicos-section{
    max-width: 600px;
    margin: 56px auto 0;
    padding: 0 4px;
  }
  .musicos-titulo{
    text-align: center;
    margin-bottom: 6px;
  }
  .musicos-titulo h2{
    font-size: 22px;
    color: var(--texto);
    font-weight: 700;
  }
  .musicos-titulo p{
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--coral);
    margin-top: 4px;
  }
  .musicos-lista{
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 22px;
  }
  .musico-card{
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--noche-2);
    border: 1px solid rgba(224,169,64,0.25);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .musico-foto{
    width: 56px;
    height: 56px;
    min-width: 56px;
    border-radius: 50%;
    background: var(--noche);
    border: 2px solid var(--oro);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .musico-foto img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .musico-foto span{
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 8px;
    color: var(--texto-suave);
  }
  .musico-datos{
    flex: 1;
    font-family: 'Trebuchet MS', sans-serif;
  }
  .musico-nombre{
    font-size: 15px;
    color: var(--texto);
    font-weight: bold;
  }
  .musico-genero{
    font-size: 12px;
    color: var(--texto-suave);
    margin-top: 2px;
  }
  .musico-contacto{
    font-size: 12px;
    text-decoration: none;
    color: var(--noche);
    background: var(--oro);
    padding: 7px 12px;
    border-radius: 20px;
    white-space: nowrap;
    font-family: 'Trebuchet MS', sans-serif;
    font-weight: bold;
  }
</style>
</head>
<body>

  <header>
    <h1>¿Dónde se baila <span>hoy</span>?</h1>
    <p>En Vallarta</p>
    <div class="linea"></div>
  </header>

  <main>
    <!-- Banner 1 -->
    <div class="evento-item">
      <div class="banner-slot" id="banner-1" onclick="abrirFicha('1')" tabindex="0">
        <img src="Mestizo.png" alt="Sandra Haro, Licenciada en Marketing">
      </div>
      <div class="evento-info">
        <span class="evento-nombre" id="nombre-1"></span>
        <span class="evento-estrellas" id="estrellas-1"></span>
      </div>
    </div>

    <!-- Banner 2 -->
    <div class="evento-item">
      <div class="banner-slot" id="banner-2" onclick="abrirFicha('2')" tabindex="0">
        <img src="Catrina.png" alt="Sandra Haro, Licenciada en Marketing">
      </div>
      <div class="evento-info">
        <span class="evento-nombre" id="nombre-2"></span>
        <span class="evento-estrellas" id="estrellas-2"></span>
      </div>
    </div>

    <!-- Banner 3 -->
    <div class="evento-item">
      <div class="banner-slot" id="banner-3" onclick="abrirFicha('3')" tabindex="0">
        <img src="Masha.png" alt="Sandra Haro, Licenciada en Marketing">
      </div>
      <div class="evento-info">
        <span class="evento-nombre" id="nombre-3"></span>
        <span class="evento-estrellas" id="estrellas-3"></span>
      </div>
    </div>

    <!-- Banner 4 -->
    <div class="evento-item">
      <div class="banner-slot" id="banner-4" onclick="abrirFicha('4')" tabindex="0">
        <img src="Patobo.png" alt="Pato Borracho">
      </div>
      <div class="evento-info">
        <span class="evento-nombre" id="nombre-4"></span>
        <span class="evento-estrellas" id="estrellas-4"></span>
      </div>
    </div>

    <!-- Banner 5 -->
    <div class="evento-item">
      <div class="banner-slot" id="banner-5" onclick="abrirFicha('5')" tabindex="0">
        <img src="Zapatillo.png" alt="Zapatillo Sport Bar">
      </div>
      <div class="evento-info">
        <span class="evento-nombre" id="nombre-5"></span>
        <span class="evento-estrellas" id="estrellas-5"></span>
      </div>
    </div>

    <!-- Banner 6 -->
    <div class="evento-item">
      <div class="banner-slot" id="banner-6" onclick="abrirFicha('6')" tabindex="0">
        <img src="Salsero.png" alt="Baile">
      </div>
      <div class="evento-info">
        <span class="Bistro" id="nombre-6"></span>
        <span class="evento-estrellas" id="estrellas-5"></span>
      </div>
    </div>

    
  </main>

  <!-- ===== Sección: Músicos y DJs disponibles para contratar ===== -->
  <section class="musicos-section">
    <div class="musicos-titulo">
      <h2>Músicos y DJs disponibles</h2>
      <p>Contrátalos para tu evento</p>
    </div>
    <div class="musicos-lista" id="musicos-lista"></div>
  </section>

  <footer>
    Infinity AI Lab · Eventos de baile en Puerto Vallarta
  </footer>

  <!-- ===== Ficha de información (se llena con JS) ===== -->
  <div class="overlay" id="overlay" onclick="cerrarFichaFuera(event)">
    <div class="ficha">
      <button class="ficha-cerrar" onclick="cerrarFicha()">&times;</button>
      <div class="ficha-logo" id="ficha-logo">
        <span>LOGO</span>
      </div>
      <div class="ficha-nombre" id="ficha-nombre">Nombre del lugar</div>
      <div class="ficha-tipo" id="ficha-tipo">DJ / Banda en vivo</div>
      <div class="ficha-datos">
        <div class="ficha-fila">
          <span class="etiqueta">Días</span>
          <span class="valor" id="ficha-dias">—</span>
        </div>
        <div class="ficha-fila">
          <span class="etiqueta">Hora</span>
          <span class="valor" id="ficha-hora">—</span>
        </div>
        <div class="ficha-fila">
          <span class="etiqueta">Lugar</span>
          <span class="valor" id="ficha-lugar">—</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // DATOS DE CADA EVENTO — edítalos aquí manualmente
    // Cada clave (1,2,3,4,5) corresponde al banner con ese número.
    // "logo": ruta de la imagen circular (déjalo en "" si no tienes logo aún)
    // "estrellas": 4 o 5 — puntuación que se muestra bajo el banner
    // ============================================
    const EVENTOS = {
      "1": {
        logo: "Logomestizo.jpeg",
        nombre: "Mestizo",
        tipo: "Musica en vivo",
        dias: "Juev Vier Sábados",
        hora: "11 a 5 am",
        lugar: "Malecón Pto. Vallarta",
        estrellas: 5
      },
      "2": {
        logo: "Logocatrina.png",
        nombre: "La catrina",
        tipo: "Musica en vivo",
        dias: "Sábados",
        hora: "9:00 pm",
        lugar: "Puerto Vallarta",
        estrellas: 4
      },
      "3": {
        logo: "Logom.png",
        nombre: "El jardin de Masha",
        tipo: "Banda en vivo",
        dias: "Jueves y Sábados",
        hora: "8:00 pm",
        lugar: "Mezcales Nayarit",
        estrellas: 5
      },
      "4": {
        logo: "Logop.png",
        nombre: "Drunken Duck",
        tipo: "Musica en vivo",
        dias: "Sáb",
        hora: "9:00 pm",
        lugar: "Nuevo Nayarit",
        estrellas: 5
      },
      "5": {
        logo: "Logoz.jpeg",
        nombre: "Zapatillo Sport Bar",
        tipo: "Taqueria Bar",
        dias: "Domingos",
        hora: "9:00 pm",
        lugar: "Puerto Vallarta",
        estrellas: 5
      },
      "6": {
        logo: "",
        nombre: "",
        tipo: "",
        dias: "",
        hora: "",
        lugar: "Puerto Vallarta",
        estrellas: 5
      }
    };

    // ============================================
    // MÚSICOS Y DJs DISPONIBLES — edítalos aquí manualmente
    // Agrega, quita o edita tantos como quieras copiando un bloque.
    // "whatsapp": número con código de país, sin espacios ni signos (ej. 523221234567)
    // ============================================
    const MUSICOS = [
      {
        foto: "Kuko.png",
        nombre: "DJ Kuko",
        genero: "Salsa · Bachata",
        whatsapp: "523223058485"
      },
      {
        foto: "Luis.png",
        nombre: "DJ Luis Alvarado",
        genero: "Salsa",
        whatsapp: "523223058485"
      },
      {
        foto: "Escuela.png",
        nombre: "La escuela",
        genero: "Banda Salsa Cubana",
        whatsapp: "523223058485"
      }
    ];

    function renderEstrellas(n){
      const llenas = "★".repeat(n);
      const vacias = "☆".repeat(5 - n);
      return llenas + vacias;
    }

    function pintarInfoEventos(){
      Object.keys(EVENTOS).forEach(function(id){
        const datos = EVENTOS[id];
        const nombreEl = document.getElementById('nombre-' + id);
        const estrellasEl = document.getElementById('estrellas-' + id);
        if(nombreEl) nombreEl.textContent = datos.nombre;
        if(estrellasEl) estrellasEl.textContent = renderEstrellas(datos.estrellas || 5);
      });
    }

    function pintarMusicos(){
      const lista = document.getElementById('musicos-lista');
      lista.innerHTML = MUSICOS.map(function(m){
        const fotoHTML = m.foto
          ? `<img src="${m.foto}" alt="${m.nombre}">`
          : `<span>FOTO</span>`;
        return `
          <div class="musico-card">
            <div class="musico-foto">${fotoHTML}</div>
            <div class="musico-datos">
              <div class="musico-nombre">${m.nombre}</div>
              <div class="musico-genero">${m.genero}</div>
            </div>
            <a class="musico-contacto" href="https://wa.me/${m.whatsapp}" target="_blank">Contactar</a>
          </div>
        `;
      }).join('');
    }

    pintarInfoEventos();
    pintarMusicos();

    function abrirFicha(id){
      const datos = EVENTOS[id];
      if(!datos) return;

      document.getElementById('ficha-nombre').textContent = datos.nombre;
      document.getElementById('ficha-tipo').textContent = datos.tipo;
      document.getElementById('ficha-dias').textContent = datos.dias;
      document.getElementById('ficha-hora').textContent = datos.hora;
      document.getElementById('ficha-lugar').textContent = datos.lugar;

      const logoBox = document.getElementById('ficha-logo');
      if(datos.logo){
        logoBox.innerHTML = `<img src="${datos.logo}" alt="Logo de ${datos.nombre}">`;
      } else {
        logoBox.innerHTML = `<span>LOGO</span>`;
      }

      document.getElementById('overlay').classList.add('activo');
    }

    function cerrarFicha(){
      document.getElementById('overlay').classList.remove('activo');
    }

    function cerrarFichaFuera(evento){
      if(evento.target.id === 'overlay'){
        cerrarFicha();
      }
    }
  </script>

</body>
</html>
